name: Recolher dados

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC: o dia anterior já está completo
  workflow_dispatch:       # permite correr à mão para testar

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run radios.py
      - name: Commit dos dados novos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados de $(date -u -d yesterday +%F)"
            git push
          fi